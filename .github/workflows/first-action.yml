name: First GitHub Action

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub runner-ul descarcă repository-ul
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalează Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instalează dependințele aplicației
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Rulează testele Python
      - name: Run tests
        run: |
          pytest

      # 5. Login în GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Construiește imaginea Docker
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/valentin803/kubernetes-project:latest .

      # 7. Pornește containerul și testează aplicația
      - name: Test Docker container
        run: |
          docker run -d \
            --name python-app-test \
            -p 5000:5000 \
            ghcr.io/valentin803/kubernetes-project:latest

          echo "Waiting for Flask application to start..."
          sleep 5

          docker ps
          curl --fail http://localhost:5000

      # 8. Șterge containerul de test
      - name: Remove test container
        if: always()
        run: |
          docker rm -f python-app-test || true

      # 9. Trimite imaginea Docker în GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/valentin803/kubernetes-project:latest