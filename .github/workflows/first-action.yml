name: First GitHub Action

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarcă repository-ul pe GitHub Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalează Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instalează dependențele aplicației
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Rulează testele Python
      - name: Run tests
        run: |
          python -m pytest

      # 5. Login în GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Construiește imaginea Docker
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/valentin803/kubernetes-project:${{ github.sha }} \
            -t ghcr.io/valentin803/kubernetes-project:latest \
            .

      # 7. Pornește containerul și testează aplicația Flask
      - name: Test Docker container
        run: |
          docker run -d \
            --name python-app-test \
            -p 5000:5000 \
            ghcr.io/valentin803/kubernetes-project:${{ github.sha }}

          echo "Waiting for Flask application to start..."
          sleep 5

          docker ps

          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:5000

      # 8. Șterge containerul de test
      - name: Remove test container
        if: always()
        run: |
          docker rm -f python-app-test || true

      # 9. Trimite imaginea Docker în GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/valentin803/kubernetes-project:${{ github.sha }}
          docker push ghcr.io/valentin803/kubernetes-project:latest

      # 10. Configurează conexiunea SSH către masterul Kubernetes
      - name: Setup SSH
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$VULTR_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VULTR_HOST" >> ~/.ssh/known_hosts

      # 11. Deploy automat al noii imagini în Kubernetes
      - name: Deploy to Kubernetes
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$VULTR_USER@$VULTR_HOST" \
            "kubectl set image deployment/python-app \
            python-app=ghcr.io/valentin803/kubernetes-project:${{ github.sha }} && \
            kubectl rollout status deployment/python-app --timeout=120s"

      # 12. Verifică Deployment-ul după update
      - name: Verify Kubernetes deployment
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$VULTR_USER@$VULTR_HOST" \
            "kubectl get deployment python-app && \
            kubectl get pods -l app=python-app"